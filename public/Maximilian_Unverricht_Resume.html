<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebenslauf - Maximilian Unverricht</title>

    <style>
        :root {
            --primary: #2d3436;
            --secondary: #636e72;
            --accent: #0984e3;
            --bg: #ffffff;
            --text: #2d3436;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            background-color: #f5f6fa;
        }

        .resume-container {
            background: #ffffff;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        header {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .contact-info {
            color: var(--secondary);
            font-size: 14px;
            margin-top: 10px;
        }

        .contact-info span {
            margin-right: 15px;
        }

        .summary {
            font-size: 16px;
            margin-bottom: 30px;
            font-style: italic;
            color: #444;
        }

        h2 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 30px;
            color: var(--accent);
        }

        .experience-item,
        .project-item {
            margin-bottom: 25px;
        }

        .item-title {
            font-weight: 700;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }

        .item-subtitle {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .item-date {
            font-weight: 400;
            font-size: 14px;
            color: #999;
        }

        ul {
            padding-left: 20px;
            margin-top: 5px;
        }

        li {
            margin-bottom: 5px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .skill-category strong {
            display: block;
            margin-bottom: 5px;
            color: var(--primary);
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }

            .resume-container {
                box-shadow: none;
                padding: 0;
            }

            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="resume-container">
        <header>
            <h1>Maximilian Unverricht</h1>
            <div class="contact-info">
                <span>Webentwicklung &amp; AI-assisted Automatisierung</span>
                <span>info@munverricht.org</span>
                <span>+49 163 3229892</span>
            </div>
        </header>

        <div class="summary">
            Dieser ältere Link wurde durch den aktuellen, evidenzbasierten Lebenslauf ersetzt.
            <a href="Maximilian_Unverricht_Resume_2026.html">Aktuellen Lebenslauf öffnen</a>.
        </div>
    </div>
</body>

</html>
